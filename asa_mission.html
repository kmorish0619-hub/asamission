<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>あさミッション</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;background:#f6f4ee;color:#252525}
main{max-width:520px;margin:auto;padding:24px 18px 110px}
.hero{padding:12px 2px 22px}.hero small{color:#777}.hero h1{font-size:30px;margin:7px 0}.hero p{margin:0;color:#666}
.progress{height:12px;background:#e4e0d7;border-radius:99px;overflow:hidden;margin:18px 0 7px}.bar{height:100%;width:0;background:#252525;transition:.3s}
.count{text-align:right;font-size:13px;color:#777}
.card{background:#fff;border-radius:22px;padding:6px 16px;box-shadow:0 6px 22px #0000000c}
.task{display:flex;align-items:center;gap:14px;padding:17px 2px;border-bottom:1px solid #eee}.task:last-child{border:0}
button.check{width:34px;height:34px;border:2px solid #bbb;border-radius:50%;background:#fff;font-size:19px}
.task.done{opacity:.48;text-decoration:line-through}.task.done .check{background:#252525;color:#fff;border-color:#252525}
.icon{font-size:25px;width:32px;text-align:center}.txt{flex:1}.txt b{display:block;font-size:17px}.txt span{font-size:12px;color:#888}
.finish{display:none;text-align:center;background:#fff;margin-top:18px;padding:24px;border-radius:22px}.finish h2{font-size:25px;margin:6px}.finish p{color:#666}
.reset{border:0;background:none;color:#888;padding:18px;width:100%}
</style></head>
<body><main>
<section class="hero"><small id="date"></small><h1>おはよう！☀️</h1><p>ぜんぶクリアして、気持ちよく出発しよう。</p>
<div class="progress"><div class="bar" id="bar"></div></div><div class="count" id="count"></div></section>
<div class="card" id="tasks"></div>
<div class="finish" id="finish"><div style="font-size:54px">🎉</div><h2>ぜんぶできた！</h2><p>今日も最高のスタート！</p></div>
<button class="reset" onclick="resetAll()">↻ 今日のチェックをリセット</button>
</main>
<script>
const base=[["👕","きがえ","パジャマから着替える"],["🪥","はみがき","歯をピカピカに"],["🎒","もちもの","忘れ物がないかチェック"],["🥣","あさごはん","しっかり食べる"],["🧦","くつした・くつ","出発の準備"],["🙌","しゅっぱつ！","いってきます！"]];
const key="asaMission-"+new Date().toISOString().slice(0,10);
let done=JSON.parse(localStorage.getItem(key)||"[]");
date.textContent=new Intl.DateTimeFormat("ja-JP",{month:"long",day:"numeric",weekday:"short"}).format(new Date());
function render(){
 tasks.innerHTML="";
 base.forEach((x,i)=>{let d=document.createElement("div");d.className="task "+(done.includes(i)?"done":"");d.innerHTML=`<button class="check">${done.includes(i)?"✓":""}</button><div class="icon">${x[0]}</div><div class="txt"><b>${x[1]}</b><span>${x[2]}</span></div>`;d.onclick=()=>toggle(i);tasks.appendChild(d)});
 let n=done.length; bar.style.width=(n/base.length*100)+"%";count.textContent=`${n} / ${base.length} クリア`;finish.style.display=n===base.length?"block":"none";
}
function toggle(i){done=done.includes(i)?done.filter(x=>x!==i):[...done,i];localStorage.setItem(key,JSON.stringify(done));render()}
function resetAll(){done=[];localStorage.removeItem(key);render()} render();
</script></body></html>
